name: 🐸 Frog VPS 保活

on:
  schedule:
    - cron: '0 0 */15 * *' # 每 15 天自动运行一次
  workflow_dispatch: # 允许手动点击测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SSH KeepAlive with HY2/Socks5 Proxy and Notify
        env:
          FROG_HOST: ${{ secrets.FROG_HOST }}
          FROG_PORT: ${{ secrets.FROG_PORT }}
          FROG_USER: ${{ secrets.FROG_USER }}
          FROG_PASS: ${{ secrets.FROG_PASS }}
          HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }} # 支持 hy2:// 协议或 socks5/http 代理
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "正在安装必要的网络和代理工具..."
          sudo apt-get update && sudo apt-get install -y sshpass netcat-openbsd curl jq

          # 检查并配置代理
          SSH_PROXY_CMD=""
          if [ -n "$HY2_PROXY_URL" ]; then
              echo "检测到已配置代理/HY2 URL，正在启动本地代理客户端..."
              
              # 如果是 hy2:// 链接，可以通过 sing-box 或 rustx 等工具转成本地 SOCKS5 代理端口
              if [[ "$HY2_PROXY_URL" =~ ^hy2:// ]]; then
                  echo "识别到 Hysteria2 (HY2) 代理协议，正在下载并配置 sing-box 客户端..."
                  
                  # 自动下载最新版 sing-box
                  SB_VERSION=$(curl -s "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | jq -r .tag_name | sed 's/v//')
                  curl -L -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v$SB_VERSION/sing-box-$SB_VERSION-linux-amd64.tar.gz"
                  tar -xzf sing-box.tar.gz
                  SB_DIR=$(ls -d sing-box-*-linux-amd64)
                  
                  # 构造临时 sing-box 配置文件，将 HY2 转换成本地 Socks5 端口 (1080)
                  cat << EOF > sb_config.json
                  {
                    "log": { "level": "error" },
                    "inbounds": [{
                      "type": "socks",
                      "tag": "socks-in",
                      "listen": "127.0.0.1",
                      "listen_port": 1080
                    }],
                    "outbounds": [{
                      "type": "hysteria2",
                      "tag": "hy2-out",
                      "server": "$(echo $HY2_PROXY_URL | sed -E 's#^hy2://([^@]+@)?([^:/]+).*#\2#')",
                      "server_port": $(echo $HY2_PROXY_URL | sed -E 's#^hy2://.*:([0-9]+).*#\1#'),
                      "password": "$(echo $HY2_PROXY_URL | sed -E 's#^hy2://([^@]+@)?([^:]+):([0-9]+)(.*)#\1#' | tr -d '@')",
                      "insecure": true
                    }]
                  }
                  EOF
                  
                  # 在后台启动 sing-box
                  ./$SB_DIR/sing-box run -c sb_config.json &
                  sleep 3
                  
                  # 设置通过本地 1080 端口的 SOCKS5 转发给 SSH
                  SSH_PROXY_CMD="-o ProxyCommand=nc -X 5 -x 127.0.0.1:1080 %h %p"
                  echo "本地 HY2 代理已成功启动并绑定至 1080 端口！"
                  
              elif [[ "$HY2_PROXY_URL" =~ ^socks5:// ]]; then
                  PROXY_HOST=$(echo $HY2_PROXY_URL | sed -E 's#^socks5://([^@]+@)?([^:]+):([0-9]+).*#\2#')
                  PROXY_PORT=$(echo $HY2_PROXY_URL | sed -E 's#^socks5://.*:([0-9]+).*#\1#')
                  SSH_PROXY_CMD="-o ProxyCommand=nc -X 5 -x $PROXY_HOST:$PROXY_PORT %h %p"
                  echo "使用标准 Socks5 代理: $PROXY_HOST:$PROXY_PORT"
                  
              elif [[ "$HY2_PROXY_URL" =~ ^http:// ]]; then
                  PROXY_HOST=$(echo $HY2_PROXY_URL | sed -E 's#^http://([^@]+@)?([^:]+):([0-9]+).*#\2#')
                  PROXY_PORT=$(echo $HY2_PROXY_URL | sed -E 's#^http://.*:([0-9]+).*#\1#')
                  SSH_PROXY_CMD="-o ProxyCommand=nc -X connect -x $PROXY_HOST:$PROXY_PORT %h %p"
                  echo "使用标准 HTTP 代理: $PROXY_HOST:$PROXY_PORT"
              fi
          else
              echo "未配置代理变量，将使用直连模式。"
          fi
          
          echo "开始尝试连接青蛙 VPS..."
          set +e
          SSH_OUTPUT=$(sshpass -p "$FROG_PASS" ssh $SSH_PROXY_CMD -o StrictHostKeyChecking=no -p "$FROG_PORT" "$FROG_USER@$FROG_HOST" "uptime && df -h" 2>&1)
          STATUS=$?
          set -e

          # 准备 Telegram 通知内容
          if [ $STATUS -eq 0 ]; then
              MESSAGE="🐸 青蛙 VPS 保活成功！%0A------------------%0A主机: $FROG_HOST%0A代理模式: $( [ -n "$HY2_PROXY_URL" ] && echo "已通过 HY2/代理" || echo "直连" )%0A输出结果:%0A$SSH_OUTPUT"
              echo "保活成功！"
          else
              MESSAGE="❌ 青蛙 VPS 保活失败！%0A------------------%0A主机: $FROG_HOST%0A错误信息:%0A$SSH_OUTPUT"
              echo "保活失败，错误码: $STATUS"
          fi

          # 发送 Telegram 通知
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
              echo "正在发送 Telegram 通知..."
              curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
                  -d "chat_id=$TG_CHAT_ID" \
                  -d "text=$MESSAGE"
          fi
          
          exit $STATUS
